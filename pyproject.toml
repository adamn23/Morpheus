[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheus"
version = "0.1.0.dev0"
description = "Local-first N-of-1 research platform for auditory lucid-dream cueing"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 forbids "License ::" classifiers alongside a license expression;
# the expression below is the licence declaration. "Private :: Do Not Upload"
# is not a real classifier but PyPI rejects any package carrying it, which is
# the point: this is proprietary and must never be published by accident.
classifiers = ["Private :: Do Not Upload"]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

# Every entry is justified in docs/design.md §8. PyTorch remains explicitly
# out of scope until M4 passes with labelled reference data (design.md §11):
# a sequence model trained on an unvalidated target would fit noise.
dependencies = [
    "opencv-python>=4.10",  # capture, quality metrics, YuNet presence, motion
    "numpy>=2.0",           # feature math
    "pydantic>=2.7",        # typed config + feature frames
    "typer>=0.12",          # CLI
    "scipy>=1.11",          # power calculation, statistics
    "scikit-learn>=1.4",    # M4 classifier, AUC, calibration curves
    "sounddevice>=0.4",     # M2 cue playback via PortAudio
    "mediapipe>=0.10",      # M1 dense face mesh; degrades to YuNet if absent
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
morpheus = "morpheus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:morpheus.*"]
